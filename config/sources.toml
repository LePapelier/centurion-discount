# --- Sites bloqués par le réseau de l'environnement (testé le 06/10/2026) ---------
# Réponse du proxy : « CONNECT tunnel failed, response 403 ». Ils sont couverts à chaque
# passage par les recherches web de config/recherches.md ; pour les lire directement,
# autorise le domaine dans le réseau de l'environnement puis vérifie l'URL du flux :
#   bonsplansmania.fr (Envie de Plus, 100 % remboursés), www.enviedeplus.com (P&G, pas de flux),
#   www.toutgratuit.fr, www.echantillonsclub.com, www.radins.com,
#   www.hotukdeals.com / www.mydealz.de (même moteur que Dealabs : /rss/hot).

