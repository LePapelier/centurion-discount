# Sources scannées à chaque passage de la routine.
#
# type = "rss"        -> flux RSS ou Atom (newsletters via kill-the-newsletter incluses)
#        "gamerpower" -> API JSON GamerPower (jeux / DLC offerts)
#        "epic"       -> API JSON des jeux gratuits Epic Games Store
#
# Mets enabled = false pour couper une source sans la supprimer.
# Chaque domaine doit être autorisé dans la politique réseau de l'environnement cloud.

[[source]]
name = "Dealabs - Hot"
type = "rss"
url = "https://www.dealabs.com/rss/hot"
category = "general"
enabled = true

[[source]]
name = "Dealabs - Gratuit"
type = "rss"
url = "https://www.dealabs.com/rss/groupe/gratuit"
category = "gratuit"
enabled = true

[[source]]
name = "GamerPower"
type = "gamerpower"
url = "https://www.gamerpower.com/api/giveaways?sort-by=value"
category = "jeux"
enabled = true

[[source]]
name = "Epic Games - Gratuits"
type = "epic"
url = "https://store-site-backend-static.ak.epicgames.com/freeGamesPromotions?locale=fr&country=FR&allowCountries=FR"
category = "jeux"
enabled = true

# Reddit limite fortement le nombre de requêtes : on regroupe les subreddits
# avec « + » dans une même URL plutôt qu'une source par subreddit.
[[source]]
name = "Reddit - gratuits (FreeGameFindings, googleplaydeals, AppHookup)"
type = "rss"
url = "https://www.reddit.com/r/FreeGameFindings+googleplaydeals+AppHookup/new/.rss?limit=50"
category = "jeux/apps"
enabled = true

[[source]]
name = "r/GameDeals (top du jour)"
type = "rss"
url = "https://www.reddit.com/r/GameDeals/top/.rss?t=day"
category = "jeux"
enabled = true

[[source]]
name = "Giveaway of the Day"
type = "rss"
url = "https://www.giveawayoftheday.com/feed/"
category = "logiciels"
# Redirige vers feeds.feedburner.com : ajouter ce domaine au réseau avant de réactiver.
enabled = false

[[source]]
name = "Secret Flying (erreurs de prix vols)"
type = "rss"
url = "https://www.secretflying.com/feed/"
category = "voyage"
# Protégé par Cloudflare : HTTP 403 même avec un UA de navigateur (testé le 06/10/2026).
enabled = false

